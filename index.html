<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>软件站</title>
<meta name="description" content="自己写的小工具，免费拿走。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23A63D22'/><rect x='8' y='10' width='16' height='12' fill='none' stroke='%23F7F5F0' stroke-width='2'/></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#F7F5F0;
  --paper-2:#FFFDF8;
  --ink:#12110F;
  --ink-2:#4C4840;
  --ink-3:#8B8578;
  --line:#D9D4C6;
  --accent:#A63D22;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;
}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:var(--paper)}
.wrap{width:100%;max-width:820px;margin:0 auto;padding:0 28px}

/* 顶栏 */
.top{border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;height:62px;gap:14px}
.mark{display:flex;align-items:center;gap:9px}
.mark svg{display:block}
.mark span{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-3)}
.top .gh{margin-left:auto;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px;transition:color .18s}
.top .gh:hover{color:var(--accent)}

/* 头部 */
header .wrap{padding-top:78px;padding-bottom:54px}
h1{font-size:clamp(38px,6.4vw,58px);font-weight:600;letter-spacing:-.035em;line-height:1.1}
.sub{margin-top:14px;font-size:15px;color:var(--ink-2)}
.sub b{font-weight:500;color:var(--ink)}

/* 列表 */
.list{border-top:1px solid var(--ink)}
.item{
  display:grid;grid-template-columns:44px 1fr auto;
  gap:20px;align-items:start;
  padding:26px 6px 26px 0;
  border-bottom:1px solid var(--line);
  transition:background .18s;
}
.item:hover{background:var(--paper-2)}
.item:hover .go{transform:translateX(4px);color:var(--accent)}
.item:hover h2{color:var(--accent)}
.no{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.1em;padding-top:9px}
.item h2{font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.3;transition:color .18s}
.en{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;margin-top:5px}
.desc{margin-top:10px;font-size:14px;color:var(--ink-2);max-width:560px}
.meta{
  margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 14px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em;
}
.go{
  display:flex;align-items:center;gap:8px;padding-top:6px;
  font-size:12.5px;color:var(--ink-3);white-space:nowrap;
  transition:transform .2s cubic-bezier(.2,.8,.2,1),color .18s;
}

/* 页脚 */
footer{margin-top:auto;border-top:1px solid var(--line)}
footer .wrap{
  display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;
  padding-top:24px;padding-bottom:44px;font-size:12.5px;color:var(--ink-3);
}
footer .r{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em}

@media (max-width:640px){
  .wrap{padding:0 20px}
  header .wrap{padding-top:52px;padding-bottom:38px}
  .item{grid-template-columns:1fr;gap:0;padding:22px 0}
  .no{display:none}
  .item h2{font-size:20px}
  .desc{font-size:13.5px}
  .go{padding-top:14px;font-size:12px}
}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <div class="mark">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <rect x="0.6" y="0.6" width="16.8" height="16.8" fill="none" stroke="#12110F"/>
        <rect x="4" y="5.5" width="10" height="7" fill="none" stroke="#A63D22" stroke-width="1.5"/>
      </svg>
      <span>BIOLMZ / SOFTWARE</span>
    </div>
    <a class="gh" href="https://github.com/biolmz" target="_blank" rel="noopener">
      GitHub
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
        <path d="M2 9 9 2M9 2H4M9 2v5" stroke="currentColor" stroke-width="1.3"/>
      </svg>
    </a>
  </div>
</div>

<header>
  <div class="wrap">
    <h1>软件站</h1>
    <p class="sub">自己写的工具，<b>免费拿走</b>。没有账号，没有会员。</p>
  </div>
</header>

<main class="wrap" style="padding-bottom:64px">
  <div class="list" id="list"></div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 biolmz</span>
    <span>·</span>
    <span>全部免费</span>
    <span class="r" id="cnt"></span>
  </div>
</footer>

<script>
const APPS = [
  {
    name:'拾阅', en:'Shiyue',
    desc:'本地文献阅读器。网页、PDF、论文链接存到本地，能高亮批注，导出进 Zotero。',
    ver:'v1.2.0', size:'79.1 MB',
    platforms:['Windows','macOS'],
    link:'https://biolmz.github.io/shiyue/'
  },
  {
    name:'BiliCrawler', en:'Bili Crawler',
    desc:'B 站视频采集下载器。解析、勾选、下载，视频、分P、投稿、评论、弹幕一起处理。',
    ver:'v1.1.1', size:'46.4 MB',
    platforms:['Windows','macOS','Linux'],
    link:'https://biolmz.github.io/bili-crawler/'
  }
];

document.getElementById('list').innerHTML = APPS.map((a, i) => `
  <a class="item" href="${a.link}" target="_blank" rel="noopener">
    <span class="no">${String(i+1).padStart(2,'0')}</span>
    <div>
      <h2>${a.name}</h2>
      <div class="en">${a.en}</div>
      <p class="desc">${a.desc}</p>
      <div class="meta">
        <span>${a.platforms.join(' / ')}</span>
        <span>${a.ver}</span>
        <span>${a.size}</span>
      </div>
    </div>
    <span class="go">
      前往
      <svg width="14" height="9" viewBox="0 0 14 9" fill="none" aria-hidden="true">
        <path d="M0 4.5h12M8.5 1 12 4.5 8.5 8" stroke="currentColor" stroke-width="1.3"/>
      </svg>
    </span>
  </a>
`).join('');

document.getElementById('cnt').textContent = String(APPS.length).padStart(2,'0') + ' ITEMS';
</script>
</body>
</html>
